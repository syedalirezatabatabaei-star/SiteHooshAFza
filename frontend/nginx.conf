# هوش افزا — Nginx config
# Serves the static frontend and proxies API / Django traffic.

server {
    listen 80;
    server_name aihooshafza.ir www.aihooshafza.ir _;

    # Frontend static files
    root /usr/share/nginx/html;
    index index.html;

    # Max upload size (videos / documents)
    client_max_body_size 100m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets: cache aggressively
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # FastAPI → hooshafza-api container (port 8000)
    location ^~ /media/ {
        proxy_pass http://hooshafza-api:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://hooshafza-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI Swagger docs
    location /docs {
        proxy_pass http://hooshafza-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /openapi.json {
        proxy_pass http://hooshafza-api:8000;
        proxy_set_header Host $host;
    }

    # Django admin → hooshafza-backend container (port 8001)
    location /admin/ {
        proxy_pass http://hooshafza-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /staticadmin/ {
        proxy_pass http://hooshafza-backend:8001/static/;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://hooshafza-backend:8001/static/;
        proxy_set_header Host $host;
        expires 7d;
    }

    # Clean URLs: /login → /pages/login.html
    location / {
        try_files $uri $uri/ @pages;
    }

    location @pages {
        # /login → pages/login.html ; /pages/x.html served directly
        rewrite ^/([a-zA-Z0-9_-]+)/?$ /pages/$1.html last;
    }

    # 404 page
    error_page 404 /pages/404.html;
}
