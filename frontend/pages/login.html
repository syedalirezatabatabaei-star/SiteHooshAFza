<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <title>ورود | هوش افزا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body class="hoosh-theme">
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="/assets/images/logo.jpg" alt="لوگوی هوش افزا" style="width:72px;height:72px;object-fit:contain;margin-bottom:var(--space-3)">
                <h1 style="font-size:var(--text-2xl);color:var(--primary-700)">هوش افزا</h1>
            </div>
            <h2 class="auth-title">ورود به حساب کاربری</h2>

            <div id="errorAlert" class="alert alert-error hidden"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="phone">شماره تلفن</label>
                    <input type="tel" id="phone" class="form-input" placeholder="09121234567" required
                           pattern="^0[0-9]{10}$" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">رمز عبور</label>
                    <input type="password" id="password" class="form-input" placeholder="رمز عبور" required
                           minlength="6" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-lg" id="submitBtn">
                    ورود
                </button>
            </form>

            <div class="auth-footer">
                حساب کاربری ندارید؟
                <a href="/pages/register.html" style="color:var(--primary-600);font-weight:600">ثبت‌نام کنید</a>
            </div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorAlert');
            const btn = document.getElementById('submitBtn');

            if (!phone || !password) {
                errorEl.textContent = 'لطفاً همه فیلدها را پر کنید';
                errorEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'در حال ورود...';
            errorEl.classList.add('hidden');

            try {
                const user = await Auth.login(phone, password);
                Utils.showToast('ورود موفق', 'success');
                if (user.role === 'ADMIN') {
                    window.location.href = '/pages/admin-dashboard.html';
                } else {
                    window.location.href = '/pages/dashboard.html';
                }
            } catch (err) {
                errorEl.textContent = err.message || 'خطا در ورود';
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'ورود';
            }
        });
    </script>
</body>
</html>
