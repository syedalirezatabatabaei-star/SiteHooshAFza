<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <meta name="description" content="دوره‌های آموزشی هوش افزا | دوره‌های حضوری و آنلاین">
    <title>دوره‌ها | هوش افزا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body class="hoosh-theme">
    <div id="header"></div>

    <section class="py-8" style="background:var(--bg-secondary)">
        <div class="container">
            <h1 class="section-title">دوره‌های آموزشی</h1>
            <p class="section-subtitle">بهترین دوره‌ها برای رشد حرفه‌ای شما</p>

            <!-- Filters -->
            <div class="flex gap-3 flex-wrap mb-6">
                <a href="/pages/courses.html" class="btn btn-sm btn-primary filter-btn" data-type="all">همه</a>
                <a href="/pages/courses.html?type=IN_PERSON" class="btn btn-sm btn-outline filter-btn" data-type="IN_PERSON">حضوری</a>
                <a href="/pages/courses.html?type=RECORDED" class="btn btn-sm btn-outline filter-btn" data-type="RECORDED">ضبط‌شده</a>
            </div>

            <!-- Search -->
            <div class="mb-6" style="max-width:400px">
                <input type="search" class="form-input" id="searchInput" placeholder="جستجوی دوره..." aria-label="جستجو">
            </div>

            <!-- Courses Grid -->
            <div id="coursesGrid" class="grid grid-3"></div>
            <div id="pagination"></div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components/header.js"></script>
    <script src="/js/components/footer.js"></script>
    <script src="/js/components/course-card.js"></script>
    <script>
        let currentPage = 1;

        async function loadCourses(page = 1) {
            currentPage = page;
            const container = document.getElementById('coursesGrid');
            const type = Utils.getUrlParam('type');
            const category = Utils.getUrlParam('category');
            const search = Utils.getUrlParam('search') || document.getElementById('searchInput').value;

            Utils.showLoading(container);

            let endpoint = `/courses?page=${page}&page_size=12`;
            if (type) endpoint += `&type=${type}`;
            if (category) endpoint += `&category=${category}`;
            if (search) endpoint += `&search=${encodeURIComponent(search)}`;

            try {
                const data = await API.get(endpoint);
                if (data.items && data.items.length > 0) {
                    container.innerHTML = data.items.map(renderCourseCard).join('');
                    Utils.createPagination(document.getElementById('pagination'), data.page, data.pages, loadCourses);
                } else {
                    Utils.showEmpty(container, 'دوره‌ای یافت نشد');
                    document.getElementById('pagination').innerHTML = '';
                }
            } catch (e) {
                Utils.showError(container, e.message || 'خطا در بارگذاری دوره‌ها');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            Header.init();
            Footer.init();

            // Highlight active filter
            const type = Utils.getUrlParam('type');
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.type === (type || 'all')) {
                    btn.className = 'btn btn-sm btn-primary filter-btn';
                }
            });

            // Search debounce
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => loadCourses(1), 500);
            });

            loadCourses(1);
        });
    </script>
</body>
</html>
