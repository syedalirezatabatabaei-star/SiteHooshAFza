<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <title>پنل مدیریت | هوش افزا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div id="header"></div>

    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-user-name">پنل مدیریت</div>
                <div class="sidebar-user-role">مدیر سیستم</div>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" onclick="switchAdminTab('stats')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#chart"></use></svg> آمار کلی</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('users')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#users"></use></svg> کاربران</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('courses')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#book"></use></svg> دوره‌ها</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('enrollments')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#book"></use></svg> ثبت‌نام‌ها</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('orders')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#book"></use></svg> سفارشات</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('payments')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#shield"></use></svg> پرداخت‌ها</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('discounts')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#briefcase"></use></svg> تخفیف‌ها</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('reviews')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#target"></use></svg> نظرات</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('tickets')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#mail"></use></svg> تیکت‌ها</a>
                <a href="#" class="sidebar-link" onclick="switchAdminTab('notifications')"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#bell"></use></svg> اعلان‌ها</a>
            </nav>
        </aside>

        <button class="mobile-sidebar-toggle btn btn-outline btn-full" onclick="document.getElementById('sidebar').classList.toggle('open')" style="display:none">☰ منو</button>
        <style>@media(max-width:1023px){.mobile-sidebar-toggle{display:block!important}.sidebar{display:none!important;position:fixed;top:64px;right:0;width:260px;z-index:300;box-shadow:var(--shadow-xl)}.sidebar.open{display:block!important}}</style>

        <main class="dashboard-content">
            <div id="adminContent">
                <div class="loading-overlay"><div class="spinner spinner-lg"></div></div>
            </div>
        </main>
    </div>

    <div id="footer"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/components/header.js"></script>
    <script src="/js/components/footer.js"></script>
    <script>
        if (!Auth.isLoggedIn() || !Auth.isAdmin()) { window.location.href = '/pages/login.html'; }

        async function switchAdminTab(tab) {
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            event.target.closest('.sidebar-link')?.classList.add('active');
            const c = document.getElementById('adminContent');
            c.innerHTML = '<div class="loading-overlay"><div class="spinner spinner-lg"></div></div>';

            switch(tab) {
                case 'stats':
                    try {
                        const s = await API.get('/admin/dashboard/stats');
                        c.innerHTML = `
                            <h1 style="margin-bottom:var(--space-6)">آمار کلی</h1>
                            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-4)">
                                <div class="card" style="padding:var(--space-6);text-align:center"><div style="font-size:2rem"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#users"></use></svg></div><div style="font-size:var(--text-2xl);font-weight:800">${s.students_count}</div><div class="text-muted text-sm">دانشجو</div></div>
                                <div class="card" style="padding:var(--space-6);text-align:center"><div style="font-size:2rem"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#book"></use></svg></div><div style="font-size:var(--text-2xl);font-weight:800">${s.courses_count}</div><div class="text-muted text-sm">دوره</div></div>
                                <div class="card" style="padding:var(--space-6);text-align:center"><div style="font-size:2rem"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#book"></use></svg></div><div style="font-size:var(--text-2xl);font-weight:800">${s.total_enrollments}</div><div class="text-muted text-sm">ثبت‌نام فعال</div></div>
                                <div class="card" style="padding:var(--space-6);text-align:center"><div style="font-size:2rem"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#shield"></use></svg></div><div style="font-size:var(--text-2xl);font-weight:800">${Utils.formatPrice(s.total_revenue)}</div><div class="text-muted text-sm">درآمد</div></div>
                                <div class="card" style="padding:var(--space-6);text-align:center"><div style="font-size:2rem"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#book"></use></svg></div><div style="font-size:var(--text-2xl);font-weight:800">${s.orders_count}</div><div class="text-muted text-sm">سفارش</div></div>
                                <div class="card" style="padding:var(--space-6);text-align:center"><div style="font-size:2rem"><svg class="ui-icon" aria-hidden="true"><use href="/assets/images/ui-icons.svg#mail"></use></svg></div><div style="font-size:var(--text-2xl);font-weight:800">${s.open_tickets}</div><div class="text-muted text-sm">تیکت باز</div></div>
                            </div>
                        `;
                    } catch(e) { Utils.showError(c, e.message); }
                    break;

                case 'users':
                    try {
                        const data = await API.get('/admin/users?page=1&page_size=20');
                        c.innerHTML = `
                            <div class="flex justify-between items-center mb-6"><h1>کاربران</h1></div>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>نام</th><th>تلفن</th><th>نقش</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead>
                                    <tbody>${data.items.map(u => `
                                        <tr>
                                            <td>${u.first_name} ${u.last_name}</td>
                                            <td>${u.phone_number}</td>
                                            <td>${u.role === 'ADMIN' ? '<span class="badge badge-error">مدیر</span>' : '<span class="badge badge-info">دانشجو</span>'}</td>
                                            <td>${u.is_active ? '<span class="badge badge-success">فعال</span>' : '<span class="badge badge-error">غیرفعال</span>'}</td>
                                            <td>${Utils.formatDate(u.date_joined)}</td>
                                            <td><button onclick="toggleUserActive(${u.id}, ${u.is_active})" class="btn btn-sm btn-ghost">${u.is_active ? 'غیرفعال' : 'فعال'}</button></td>
                                        </tr>
                                    `).join('')}</tbody>
                                </table>
                            </div>
                        `;
                    } catch(e) { Utils.showError(c, e.message); }
                    break;

                case 'courses':
                    c.innerHTML = '<h1>مدیریت دوره‌ها</h1><p class="text-muted mt-4">از Django Admin برای مدیریت پیشرفته دوره‌ها استفاده کنید.</p><a href="/admin/" class="btn btn-primary mt-4">ورود به Django Admin</a>';
                    break;

                case 'enrollments':
                    try {
                        const data = await API.get('/admin/enrollments?page=1&page_size=20');
                        c.innerHTML = `
                            <h1 style="margin-bottom:var(--space-6)">ثبت‌نام‌ها</h1>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>دانشجو</th><th>دوره</th><th>وضعیت</th><th>پیشرفت</th><th>تاریخ</th></tr></thead>
                                    <tbody>${data.items.map(e => `
                                        <tr>
                                            <td>${e.student.name}</td>
                                            <td>${e.course.title}</td>
                                            <td>${Utils.getStatusBadge(e.status)}</td>
                                            <td><div class="progress-bar" style="width:100px"><div class="progress-fill" style="width:${e.progress}%"></div></div></td>
                                            <td>${Utils.formatDate(e.enrolled_at)}</td>
                                        </tr>
                                    `).join('')}</tbody>
                                </table>
                            </div>
                        `;
                    } catch(e) { Utils.showError(c, e.message); }
                    break;

                case 'orders':
                    try {
                        const data = await API.get('/admin/orders?page=1&page_size=20');
                        c.innerHTML = `
                            <h1 style="margin-bottom:var(--space-6)">سفارشات</h1>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>#</th><th>کاربر</th><th>مبلغ</th><th>تخفیف</th><th>نهایی</th><th>وضعیت</th><th>تاریخ</th></tr></thead>
                                    <tbody>${data.items.map(o => `
                                        <tr>
                                            <td>${o.id}</td>
                                            <td>${o.user_name}</td>
                                            <td>${Utils.formatPrice(o.total_amount)}</td>
                                            <td>${Utils.formatPrice(o.discount_amount)}</td>
                                            <td class="price">${Utils.formatPrice(o.final_amount)}</td>
                                            <td>${Utils.getStatusBadge(o.status)}</td>
                                            <td>${Utils.formatDate(o.created_at)}</td>
                                        </tr>
                                    `).join('')}</tbody>
                                </table>
                            </div>
                        `;
                    } catch(e) { Utils.showError(c, e.message); }
                    break;

                case 'payments':
                    try {
                        const data = await API.get('/admin/payments?page=1&page_size=20');
                        c.innerHTML = `
                            <h1 style="margin-bottom:var(--space-6)">پرداخت‌ها</h1>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>#</th><th>کاربر</th><th>مبلغ</th><th>نوع</th><th>وضعیت</th><th>تاریخ</th></tr></thead>
                                    <tbody>${data.items.map(p => `
                                        <tr>
                                            <td>${p.id}</td>
                                            <td>${p.user_phone}</td>
                                            <td class="price">${Utils.formatPrice(p.amount)}</td>
                                            <td>${p.payment_type}</td>
                                            <td>${Utils.getStatusBadge(p.status)}</td>
                                            <td>${Utils.formatDate(p.created_at)}</td>
                                        </tr>
                                    `).join('')}</tbody>
                                </table>
                            </div>
                        `;
                    } catch(e) { Utils.showError(c, e.message); }
                    break;

                case 'discounts':
                    try {
                        const coupons = await API.get('/admin/discounts');
                        c.innerHTML = `
                            <div class="flex justify-between items-center mb-6">
                                <h1>کدهای تخفیف</h1>
                                <button onclick="showCreateCoupon()" class="btn btn-sm btn-primary">کد جدید</button>
                            </div>
                            <div id="couponForm" class="hidden card mb-4" style="padding:var(--space-4)">
                                <div class="grid grid-3" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
                                    <div class="form-group"><label class="form-label">کد</label><input class="form-input" id="couponCode"></div>
                                    <div class="form-group"><label class="form-label">نوع</label><select class="form-select" id="couponType"><option value="PERCENTAGE">درصدی</option><option value="FIXED">مبلغ ثابت</option></select></div>
                                    <div class="form-group"><label class="form-label">مقدار</label><input class="form-input" type="number" id="couponValue"></div>
                                    <div class="form-group"><label class="form-label">از تاریخ</label><input class="form-input" type="datetime-local" id="couponStart"></div>
                                    <div class="form-group"><label class="form-label">تا تاریخ</label><input class="form-input" type="datetime-local" id="couponEnd"></div>
                                    <div class="form-group"><label class="form-label">حداکثر استفاده</label><input class="form-input" type="number" id="couponMaxUses" value="0"></div>
                                </div>
                                <button onclick="createCoupon()" class="btn btn-primary">ایجاد</button>
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>کد</th><th>نوع</th><th>مقدار</th><th>استفاده</th><th>فعال</th></tr></thead>
                                    <tbody>${coupons.map(c => `
                                        <tr>
                                            <td><strong>${c.code}</strong></td>
                                            <td>${c.discount_type === 'PERCENTAGE' ? 'درصدی' : 'مبلغ ثابت'}</td>
                                            <td>${c.discount_value}${c.discount_type === 'PERCENTAGE' ? '%' : ' تومان'}</td>
                                            <td>${c.used_count}/${c.max_uses || '∞'}</td>
                                            <td>${c.is_active ? '<span class="badge badge-success">فعال</span>' : '<span class="badge badge-error">غیرفعال</span>'}</td>
                                        </tr>
                                    `).join('')}</tbody>
                                </table>
                            </div>
                        `;
                    } catch(e) { Utils.showError(c, e.message); }
                    break;

                case 'reviews':
                    try {
                        const data = await API.get('/admin/reviews?page=1&page_size=20');
                        c.innerHTML = `
                            <h1 style="margin-bottom:var(--space-6)">نظرات</h1>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>دانشجو</th><th>دوره</th><th>امتیاز</th><th>نظر</th><th>وضعیت</th><th>عملیات</th></tr></thead>
                                    <tbody>${data.items.map(r => `
                                        <tr>
                                            <td>${r.student}</td>
                                            <td>${r.course}</td>
                                            <td>${r.rating}/5</td>
                                            <td>${r.comment.substring(0, 50)}...</td>
                                            <td>${Utils.getStatusBadge(r.status)}</td>
                                            <td>
                                                ${r.status === 'PENDING' ? `
                                                    <button onclick="approveReview(${r.id})" class="btn btn-sm btn-ghost" style="color:var(--success)">تأیید</button>
                                                    <button onclick="rejectReview(${r.id})" class="btn btn-sm btn-ghost" style="color:var(--error)">رد</button>
                                                ` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}</tbody>
                                </table>
                            </div>
                        `;
                    } catch(e) { Utils.showError(c, e.message); }
                    break;

                case 'tickets':
                    try {
                        const data = await API.get('/admin/tickets?page=1&page_size=20');
                        c.innerHTML = `
                            <h1 style="margin-bottom:var(--space-6)">تیکت‌ها</h1>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>موضوع</th><th>کاربر</th><th>وضعیت</th><th>اولویت</th><th>تاریخ</th></tr></thead>
                                    <tbody>${data.items.map(t => `
                                        <tr>
                                            <td><strong>${t.subject}</strong></td>
                                            <td>${t.user}</td>
                                            <td>${Utils.getStatusBadge(t.status)}</td>
                                            <td>${t.priority}</td>
                                            <td>${Utils.formatDateTime(t.created_at)}</td>
                                        </tr>
                                    `).join('')}</tbody>
                                </table>
                            </div>
                        `;
                    } catch(e) { Utils.showError(c, e.message); }
                    break;

                case 'notifications':
                    c.innerHTML = `
                        <h1 style="margin-bottom:var(--space-6)">ارسال اعلان</h1>
                        <div class="card" style="padding:var(--space-6);max-width:500px">
                            <div class="form-group"><label class="form-label">شناسه کاربر</label><input class="form-input" type="number" id="notifUserId"></div>
                            <div class="form-group"><label class="form-label">عنوان</label><input class="form-input" id="notifTitle"></div>
                            <div class="form-group"><label class="form-label">پیام</label><textarea class="form-textarea" id="notifMessage"></textarea></div>
                            <button onclick="sendNotification()" class="btn btn-primary">ارسال</button>
                        </div>
                    `;
                    break;
            }
        }

        async function toggleUserActive(id, currentActive) {
            await API.put(`/admin/users/${id}`, { is_active: !currentActive });
            Utils.showToast('وضعیت کاربر تغییر کرد', 'success');
            switchAdminTab('users');
        }

        function showCreateCoupon() { document.getElementById('couponForm').classList.toggle('hidden'); }
        async function createCoupon() {
            await API.post('/admin/discounts', {
                code: document.getElementById('couponCode').value,
                discount_type: document.getElementById('couponType').value,
                discount_value: parseInt(document.getElementById('couponValue').value),
                start_date: document.getElementById('couponStart').value,
                end_date: document.getElementById('couponEnd').value,
                max_uses: parseInt(document.getElementById('couponMaxUses').value) || 0,
            });
            Utils.showToast('کد تخفیف ایجاد شد', 'success');
            switchAdminTab('discounts');
        }

        async function approveReview(id) { await API.put(`/admin/reviews/${id}/approve`); Utils.showToast('تأیید شد', 'success'); switchAdminTab('reviews'); }
        async function rejectReview(id) { await API.put(`/admin/reviews/${id}/reject`); Utils.showToast('رد شد', 'success'); switchAdminTab('reviews'); }

        async function sendNotification() {
            await API.post('/admin/notifications', {
                user_id: parseInt(document.getElementById('notifUserId').value),
                title: document.getElementById('notifTitle').value,
                message: document.getElementById('notifMessage').value,
            });
            Utils.showToast('اعلان ارسال شد', 'success');
        }

        document.addEventListener('DOMContentLoaded', () => { Header.init(); Footer.init(); switchAdminTab('stats'); });
    </script>
</body>
</html>
